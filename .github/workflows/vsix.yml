name: Build VS Code extension (.vsix)

# Builds the language server for Windows x64, Linux x64 and macOS ARM64, bundles the VS Code client and
# packages everything into one installable .vsix (Actions run > Artifacts). The extension picks the binary
# for the current platform. Pushing a tag v* also attaches the .vsix to a GitHub release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
            exe: .exe
          - os: ubuntu-latest
            platform: linux-x64
            exe: ""
          - os: macos-latest   # Apple Silicon (ARM64) runner
            platform: darwin-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build language server and c4check
        working-directory: server
        run: cargo build --release --bin lsp --bin c4check
      - name: Check binary architecture
        if: runner.os != 'Windows'
        run: file server/target/release/lsp
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}
          path: |
            server/target/release/lsp${{ matrix.exe }}
            server/target/release/c4check${{ matrix.exe }}
          if-no-files-found: error

  package:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: artifacts
      - name: Put server binaries where the extension looks for them (client/out)
        run: |
          mkdir -p client/client/out
          cp artifacts/server-win32-x64/lsp.exe client/client/out/lsp.exe
          cp artifacts/server-linux-x64/lsp client/client/out/lsp-linux-x64
          cp artifacts/server-darwin-arm64/lsp client/client/out/lsp-darwin-arm64
          chmod +x client/client/out/lsp-*
      - name: Bundle extension
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          (cd client && npm ci --no-audit --no-fund)
          npm run compile
      - name: Package .vsix
        working-directory: client
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --skip-license -o "../legacy-clonk-ext-${VERSION}.vsix"
          unzip -l "../legacy-clonk-ext-${VERSION}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-clonk-ext-vsix
          path: legacy-clonk-ext-*.vsix
          if-no-files-found: error
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: legacy-clonk-ext-*.vsix
